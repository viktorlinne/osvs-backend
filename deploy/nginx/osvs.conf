# nginx site for OSVS: frontend (static SPA) + backend API on one origin.
# Install: /etc/nginx/sites-available/osvs.conf, symlink into sites-enabled.
# Replace osvs.se with the host name you deploy to (e.g. ny.osvs.se before cutover).

# TLS settings (Mozilla "intermediate", ECDHE only so no dhparam file is
# needed). Set here instead of including /etc/letsencrypt/options-ssl-nginx.conf
# and ssl-dhparams.pem: certbot only writes those with its nginx plugin, not
# with `certbot certonly --webroot` (deploy/README.md), and nginx -t fails
# when an include is missing. These apply to every server block in this file.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:osvs_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HTTP: ACME challenges for certbot, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name osvs.se www.osvs.se;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://osvs.se$request_uri;
    }
}

# HTTPS www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.osvs.se;

    ssl_certificate     /etc/letsencrypt/live/osvs.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osvs.se/privkey.pem;

    return 301 https://osvs.se$request_uri;
}

# default_server: Swish callbacks may arrive without SNI and must land here,
# not on the www redirect above (see SWISH.md in the OSVS workspace root).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name osvs.se;

    ssl_certificate     /etc/letsencrypt/live/osvs.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osvs.se/privkey.pem;

    # HSTS here covers /api/ (no add_header of its own; Express/helmet sets the
    # other API security headers). nginx drops server-level add_header in any
    # location that has its own, so the static locations below repeat HSTS
    # together with the SPA headers. The CSP is Report-Only until a staging run
    # shows no violations in the browser console; then rename the header to
    # Content-Security-Policy (deploy/README.md).
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/osvs;
    index index.html;

    # Uploads are capped at 5 MB in the backend (PROFILE_PICTURE_MAX_SIZE, PDFs).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend API (Express on localhost:4000; TRUST_PROXY=1 in its .env).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite build output: hashed file names, cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # Always revalidate the app shell so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # SPA fallback (replaces vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
