# nginx site for OSVS: frontend (static SPA) + backend API on one origin.
# Install: /etc/nginx/sites-available/osvs.conf, symlink into sites-enabled.
# Replace osvs.se with the host name you deploy to (e.g. ny.osvs.se before cutover).

# HTTP: ACME challenges for certbot, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name osvs.se www.osvs.se;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://osvs.se$request_uri;
    }
}

# HTTPS www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.osvs.se;

    ssl_certificate     /etc/letsencrypt/live/osvs.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osvs.se/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://osvs.se$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name osvs.se;

    ssl_certificate     /etc/letsencrypt/live/osvs.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osvs.se/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/osvs;
    index index.html;

    # Uploads are capped at 5 MB in the backend (PROFILE_PICTURE_MAX_SIZE, PDFs).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend API (Express on localhost:4000; TRUST_PROXY=1 in its .env).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite build output: hashed file names, cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate the app shell so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (replaces vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
